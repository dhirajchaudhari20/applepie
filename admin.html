<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Update Menu | Apple Pie Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
        }
        .file-input {
            margin: 20px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            width: 100%;
        }
        #statusMessage {
            margin-top: 20px;
            font-weight: 600;
        }
        .success { color: var(--success); }
        .error { color: #E23744; }
    </style>
</head>
<body>
    <div class="bg-wrapper">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
    </div>

    <main class="app-container admin-container">
        <div class="card glass-card fade-in">
            <h2 class="section-title" style="justify-content: center;">Update PDF Menu</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Upload a new PDF menu. This will instantly update the "View Menu" button on the main website.</p>
            
            <input type="file" id="menuFileInput" class="file-input" accept="application/pdf">
            
            <button id="uploadBtn" class="btn primary-btn" style="background: var(--success); margin-top: 10px;">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload & Sync
            </button>
            
            <div id="statusMessage"></div>
        </div>
    </main>

    <!-- Firebase JS SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref as dbRef, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Provided Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCohKlqNu0I1sXcLW4D_fv-OEw9x0S50q8",
            authDomain: "dc-infotechpvt-1-d1a4b.firebaseapp.com",
            databaseURL: "https://dc-infotechpvt-1-d1a4b-default-rtdb.firebaseio.com",
            projectId: "dc-infotechpvt-1-d1a4b",
            storageBucket: "dc-infotechpvt-1-d1a4b.firebasestorage.app",
            messagingSenderId: "330752838328",
            appId: "1:330752838328:web:1fe0ca04953934d4638703"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("menuFileInput");
        const statusMsg = document.getElementById("statusMessage");

        uploadBtn.addEventListener("click", async () => {
            const file = fileInput.files[0];
            if (!file) {
                statusMsg.textContent = "Please select a PDF file first.";
                statusMsg.className = "error";
                return;
            }

            if (file.type !== "application/pdf") {
                statusMsg.textContent = "Only PDF files are allowed.";
                statusMsg.className = "error";
                return;
            }

            try {
                statusMsg.textContent = "Uploading... please wait.";
                statusMsg.className = "";
                uploadBtn.disabled = true;

                // 1. Upload to Storage
                const menuStorageRef = storageRef(storage, 'menu/apple_pie_menu.pdf');
                await uploadBytes(menuStorageRef, file);
                
                // 2. Get Download URL
                const downloadURL = await getDownloadURL(menuStorageRef);

                // 3. Save to Realtime Database
                await set(dbRef(db, 'settings/menuUrl'), downloadURL);

                statusMsg.textContent = "Success! Menu updated on live site.";
                statusMsg.className = "success";
                fileInput.value = ""; // clear
            } catch (error) {
                console.error("Upload failed", error);
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "error";
            } finally {
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
